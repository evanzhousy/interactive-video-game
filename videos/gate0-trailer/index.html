<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="assets/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #050709;
        --amber: #eba834;
        --amber-bright: #f5c15d;
        --frost: #9ec6d4;
        --purge: #e04634;
        --ink: #f2f5f7;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }
      .scene-slot {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <!-- Visual Sub-Compositions (9 Scenes = 60.0s exact) -->
      <div
        id="slot-scene-01"
        class="scene-slot"
        data-composition-id="scene-01"
        data-composition-src="compositions/scene-01.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="slot-scene-02"
        class="scene-slot"
        data-composition-id="scene-02"
        data-composition-src="compositions/scene-02.html"
        data-start="5"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="slot-scene-03"
        class="scene-slot"
        data-composition-id="scene-03"
        data-composition-src="compositions/scene-03.html"
        data-start="13"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="slot-scene-04"
        class="scene-slot"
        data-composition-id="scene-04"
        data-composition-src="compositions/scene-04.html"
        data-start="18"
        data-duration="11"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="slot-scene-05"

        data-composition-src="compositions/scene-05.html"
        data-start="29"
        data-duration="7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="slot-scene-06"
        class="scene-slot"
        data-composition-id="scene-06"
        data-composition-src="compositions/scene-06.html"
        data-start="36"
        data-duration="7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="slot-scene-07"
        class="scene-slot"

        data-composition-src="compositions/scene-07.html"
        data-start="43"

      ></div>
      <div
        id="slot-scene-08"

        data-height="1080"
      ></div>
      <div
        id="slot-scene-09"
        class="scene-slot"
        data-composition-id="scene-09"
        data-composition-src="compositions/scene-09.html"
        data-start="55"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Audio Tracks: Score + Foley Bed (Track 10) + 5 Voices (Track 11) -->
      <audio
        id="audio-score"
        src="assets/audio/trailer_score_sfx_60s.mp3"
        data-start="0"
        data-duration="60"
        data-track-index="10"
        data-volume="0.82"
      ></audio>
      <audio
        id="audio-elena-open"

        data-start="5.0"

      ></audio>
      <audio
        id="audio-narr-saydo"

        data-track-index="11"
        data-volume="1"
      ></audio>
      <audio
        id="audio-marcus"
        src="assets/audio/marcus_rescue_trim.mp3"
        data-start="20.6"
        data-duration="5.89"
        data-track-index="11"
        data-volume="1"
      ></audio>
      <audio
        id="audio-narr-fuel"
        src="assets/audio/narrator_fuel.mp3"
        data-start="37.3"
        data-duration="4.71"
        data-track-index="11"
        data-volume="1"
      ></audio>
      <audio
        id="audio-op09-n5"
        src="assets/audio/op09_suffix_only.mp3"
        data-start="50.25"
        data-duration="4.46"
        data-track-index="11"
        data-volume="1"
      ></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 60 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
