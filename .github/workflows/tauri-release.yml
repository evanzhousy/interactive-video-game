name: Steam Desktop Build (Tauri v2)

on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: "Publish artifacts to a draft GitHub Release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            args: "--target universal-apple-darwin"
          - name: windows-x64
            os: windows-latest
            args: ""
          - name: linux-x64-steamdeck
            os: ubuntu-22.04
            args: ""

    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebKitGTK & AppImage dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri v2 desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'desktop-playtest' }}
          releaseName: "Quarantine Gate 0 Desktop (${{ github.ref_name }})"
          releaseBody: "Cross-platform Tauri v2 Steam Playtest bundles (macOS Universal `.dmg`, Windows `.exe`/`.msi`, Linux/Steam Deck `.AppImage`/`.deb`)."
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: false

      - name: Upload workflow run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gate0-${{ matrix.name }}
          path: |
            tauri/target/**/release/bundle/dmg/*.dmg
            tauri/target/**/release/bundle/nsis/*.exe
            tauri/target/**/release/bundle/msi/*.msi
            tauri/target/**/release/bundle/appimage/*.AppImage
            tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: warn
